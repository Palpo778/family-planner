<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Семейный Планер</title>
    <link rel="stylesheet" href="styles.css?v=3">
</head>
<body>
    <!-- Экран входа -->
    <div id="loginScreen" class="screen active">
        <div class="login-container">
            <h1>👨‍👩‍👧 Семейный Планер</h1>
            <form id="loginForm">
                <input type="text" id="loginUsername" placeholder="Имя пользователя" required>
                <input type="password" id="loginPassword" placeholder="Пароль" required>
                <button type="submit" class="btn btn-primary">Войти</button>
            </form>
            <p class="switch-form">Нет аккаунта? <a href="#" onclick="showRegister()">Регистрация</a></p>
        </div>
    </div>

    <!-- Экран регистрации -->
    <div id="registerScreen" class="screen">
        <div class="login-container">
            <h1>Регистрация</h1>
            <form id="registerForm">
                <input type="text" id="regUsername" placeholder="Имя пользователя" required>
                <input type="email" id="regEmail" placeholder="Email" required>
                <input type="password" id="regPassword" placeholder="Пароль" required>
                <button type="submit" class="btn btn-primary">Зарегистрироваться</button>
            </form>
            <p class="switch-form">Уже есть аккаунт? <a href="#" onclick="showLogin()">Войти</a></p>
        </div>
    </div>

    <!-- Главное приложение -->
    <div id="appScreen" class="screen">
        <div class="container">
            <div class="header">
                <div class="logo">👨‍👩‍👧 Семейный Планер</div>
                <div class="user-menu">
                    <button class="theme-toggle" onclick="toggleTheme()">🌙</button>
                    <span id="usernameDisplay"></span>
                    <button class="btn btn-secondary" onclick="logout()">Выйти</button>
                </div>
            </div>

            <!-- Вкладки -->
            <div class="tabs">
                <button class="tab active" data-page="tasks">📋 Задачи</button>
                <button class="tab" data-page="calendar">📅 Календарь</button>
                <button class="tab" data-page="habits">🎯 Привычки</button>
            </div>

            <!-- Страница задач -->
            <div id="tasksPage" class="page active">
                <div class="tabs">
                    <button class="tab active" data-filter="my">📋 Мои дела <span class="tab-count" id="myCount">0</span></button>
                    <button class="tab" data-filter="shared">👥 Общие <span class="tab-count" id="sharedCount">0</span></button>
                    <button class="tab" data-filter="done">✅ Готово <span class="tab-count" id="doneCount">0</span></button>
                </div>

                <div class="search-box">
                    <span class="search-icon">🔍</span>
                    <input type="text" id="searchInput" class="search-input" placeholder="Поиск задач...">
                </div>

                <div id="tasksList" class="tasks-list"></div>

                <button class="add-task-btn" onclick="openModal()">+</button>
            </div>

            <!-- Страница календаря -->
            <div id="calendarPage" class="page">
                <div class="calendar-header">
                    <button class="btn btn-secondary" onclick="changeMonth(-1)">←</button>
                    <h2 id="calendarMonth"></h2>
                    <button class="btn btn-secondary" onclick="changeMonth(1)">→</button>
                </div>
                <div class="calendar-grid" id="calendarGrid"></div>
                <div id="calendarTasks" class="calendar-tasks"></div>
            </div>

            <!-- Страница привычек -->
            <div id="habitsPage" class="page">
                <div class="habits-header">
                    <h2>🎯 Мои привычки</h2>
                    <button class="btn btn-primary" onclick="openHabitModal()">+ Добавить</button>
                </div>
                <div id="habitsList" class="habits-list"></div>
            </div>
        </div>

        <!-- Модальное окно задачи -->
        <div class="modal" id="taskModal">
            <div class="modal-content">
                <h3 class="modal-header">Новая задача</h3>
                <form id="taskForm">
                    <div class="form-group">
                        <label class="form-label">Название</label>
                        <input type="text" id="taskTitle" class="form-input" placeholder="Что нужно сделать?" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Описание</label>
                        <textarea id="taskDescription" class="form-textarea" placeholder="Подробности..."></textarea>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Тип задачи</label>
                        <select id="taskType" class="form-select">
                            <option value="false">Моя личная</option>
                            <option value="true">Общая</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Исполнитель</label>
                        <select id="taskAssignee" class="form-select"></select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Срок</label>
                        <input type="datetime-local" id="taskDueDate" class="form-input">
                    </div>
                    <div class="modal-actions">
                        <button type="button" class="btn btn-secondary" onclick="closeModal()">Отмена</button>
                        <button type="submit" class="btn btn-primary">Создать</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Модальное окно привычки -->
        <div class="modal" id="habitModal">
            <div class="modal-content">
                <h3 class="modal-header">Новая привычка</h3>
                <form id="habitForm">
                    <div class="form-group">
                        <label class="form-label">Название</label>
                        <input type="text" id="habitTitle" class="form-input" placeholder="Например: Зарядка" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Описание</label>
                        <textarea id="habitDescription" class="form-textarea" placeholder="Подробности..."></textarea>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Цвет</label>
                        <input type="color" id="habitColor" class="form-input" value="#4F46E5">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Тип</label>
                        <select id="habitType" class="form-select">
                            <option value="false">Моя личная</option>
                            <option value="true">Общая</option>
                        </select>
                    </div>
                    <div class="modal-actions">
                        <button type="button" class="btn btn-secondary" onclick="closeHabitModal()">Отмена</button>
                        <button type="submit" class="btn btn-primary">Создать</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="app.js?v=3"></script>
</body>
</html>
